# Golden conversations for ShopAssist: the standard cases every release must handle.
#
#   python -m evals.run                     # real LLM from .env (+ LLM judge), FakeShopify
#   python -m evals.run --fake              # deterministic checks only (CI, no API keys)
#   python -m evals.run --category returns  # one category
#   python -m evals.run --report evals/report.json --junit evals/junit.xml
#
# Case fields
#   id, category                   unique id; category for the summary table
#   channel / kind / user_id       defaults: messenger / direct / random. WhatsApp user 919800000001 owns the
#                                  FakeShopify orders (#1042-#1046, see evals/fixtures.py)
#   turns                          customer messages; a turn can be {text, payload} for a button tap
#   retrieval                      checked in EVERY mode (deterministic): {section, within} or {found: false}
#   expect                         checks on the final reply. Run with the real LLM; in --fake mode only when
#                                  the case is `deterministic: true` or has a `fake_script`
#   judge                          rubric for the LLM judge (real-LLM mode only)
#   fake_script                    what the FakeLLM does in --fake mode: [{tool, args} | {text}]
#
# Expect keys
#   contains_any, not_contains, matches, max_chars, no_emoji, escalated (true/false/reason),
#   tools_include, grounded, quick_replies, shopify_mutation (cancel/return/none), sends_dm, hides_comment

# ── Shipping ─────────────────────────────────────────────────────────────────
- id: shipping_free_threshold
  category: shipping
  turns: ["Is shipping free?"]
  retrieval: { section: "Shipping > Domestic shipping", within: 2 }
  expect: { contains_any: ["999"], grounded: true }
  judge: "Says shipping is free on orders above ₹999 and that a ₹79 flat fee applies below that."

- id: shipping_metro_delivery_time
  category: shipping
  turns: ["How long does domestic delivery take to metro cities like Bengaluru?"]
  retrieval: { section: "Shipping > Domestic shipping", within: 2 }
  expect: { contains_any: ["2-4", "2–4", "2 to 4"], grounded: true }
  judge: "Says 2-4 business days for metro cities. Must not promise a specific date."

- id: shipping_express_pune
  category: shipping
  turns: ["Is express delivery available in Pune? How much does it cost?"]
  retrieval: { section: "Shipping > Express delivery", within: 2 }
  expect: { contains_any: ["149"], grounded: true }
  judge: "Confirms express delivery in Pune for ₹149 (1-2 business days)."

- id: shipping_international_customs
  category: shipping
  turns: ["Do you ship internationally to the UAE? Will I pay customs duties?"]
  retrieval: { section: "Shipping > International shipping", within: 2 }
  expect: { contains_any: ["7-12", "7–12", "7 to 12"], grounded: true }
  judge: "Confirms shipping to the UAE in 7-12 business days and that customs duties are paid by the customer."

- id: shipping_tracking_stuck
  category: shipping
  turns: ["My parcel tracking has not updated for 5 business days, is it lost?"]
  retrieval: { section: "Shipping > Delayed or lost parcels", within: 2 }
  judge: "Explains the team will open an investigation with the courier, and lost parcels are reshipped or refunded. Asks for the order number or offers to check."

# ── Returns & refunds ────────────────────────────────────────────────────────
- id: returns_opened_coffee
  category: returns
  turns: ["Can I return an opened bag of coffee?"]
  retrieval: { section: "Returns and refunds > Coffee beans", within: 2 }
  expect: { contains_any: ["can't", "cannot", "not able", "unable", "can not"], grounded: true }
  judge: "States opened coffee can't be returned because it's perishable. May mention the Taste Promise. Must not offer a refund for opened coffee."

- id: returns_unused_grinder
  category: returns
  turns: ["Can I return an unused grinder in its original packaging?"]
  retrieval: { section: "Returns and refunds > Brewing equipment", within: 2 }
  expect: { contains_any: ["30"], grounded: true }
  judge: "Says unused equipment can be returned within 30 days in original packaging."

- id: returns_damaged_policy
  category: returns
  turns: ["What do I do if an item arrives damaged or I received the wrong item?"]
  retrieval: { section: "Returns and refunds > Damaged or wrong items", within: 2 }
  judge: "Says to contact within 7 days of delivery with a photo, and damaged/wrong items are replaced free of charge."

- id: refunds_timing
  category: returns
  turns: ["How long do refunds take to reach my original payment method?"]
  retrieval: { section: "Returns and refunds > How refunds work", within: 2 }
  expect: { contains_any: ["5-7", "5–7", "5 to 7"], grounded: true }
  judge: "Says refunds reach the original payment method within 5-7 business days after approval."

- id: refunds_cash_on_delivery
  category: returns
  turns: ["I paid cash on delivery. How will my refund be paid?"]
  retrieval: { section: "Returns and refunds > How refunds work", within: 2 }
  judge: "Explains COD refunds are made by bank transfer (NEFT) or store credit, customer's choice."

