# Template only: never commit real values. Prefer External Secrets / Vault / your cloud's secret manager.
#   kubectl -n shopassist create secret generic shopassist-secrets --from-env-file=.env.production
apiVersion: v1
kind: Secret
metadata: { name: shopassist-secrets }
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://shopassist:CHANGE_ME@postgres.example.internal:5432/shopassist
  REDIS_URL: redis://redis.example.internal:6379/0
  REDIS_ADDRESS: redis.example.internal:6379          # for the KEDA scaler
  QDRANT_URL: https://qdrant.example.internal:6333
  QDRANT_API_KEY: CHANGE_ME
  LLM_PROVIDER: anthropic
  LLM_MODEL: claude-haiku-5-5
  LLM_API_KEY: CHANGE_ME
  LLM_FALLBACKS: "[]"
  META_APP_ID: CHANGE_ME
  META_APP_SECRET: CHANGE_ME
  META_VERIFY_TOKEN: CHANGE_ME
  PII_ENCRYPTION_KEYS: CHANGE_ME
  PII_BLIND_INDEX_KEY: CHANGE_ME
  SHOPIFY_WEBHOOK_SECRET: CHANGE_ME
  ADMIN_BOOTSTRAP_KEY: CHANGE_ME                      # remove after creating named admin keys
  # Per-tenant secrets referenced from tenant YAML as env:NAME
  BREWLINE_WHATSAPP_TOKEN: CHANGE_ME
  BREWLINE_PAGE_ACCESS_TOKEN: CHANGE_ME
  BREWLINE_SHOPIFY_CLIENT_SECRET: CHANGE_ME
