[project]
name = "shopassist"
version = "1.0.0"
description = "ShopAssist: a production-grade LLM virtual agent for e-commerce customer support (Shopify + WhatsApp/Messenger/Instagram)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "openai>=1.50",
  "anthropic>=0.40",
  "pyyaml>=6.0",
  "structlog>=24.1",
  "qdrant-client>=1.12",
  "fastembed>=0.4",
  "cryptography>=42",
  "redis>=5.0",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
ner = ["presidio-analyzer>=2.2"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "fakeredis[lua]>=2.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:Payload indexes have no effect"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "evals*"]
