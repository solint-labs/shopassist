name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Deterministic evals (no API keys needed)
        run: python -m evals.run --fake --min-pass 1.0
        env: { RAG_ENCODERS: hashing, LLM_PROVIDER: fake }
  # Add a nightly job that runs `python -m evals.run` against your real LLM with secrets.
